packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - vite@8.1.4
  - '@humanspeak/svelte-motion@0.7.16 || 0.7.18'
  - postcss@8.5.17
  - zod@4.6.5
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - jsdom@30.1.3
  - vitest@5.0.5

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
